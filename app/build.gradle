plugins { id 'com.android.application' }

android {
    namespace 'com.wade.exynostools.layer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wade.exynostools.layer'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // The phone is rejecting the previous uncompressed APK because the
    // final native-library ZIP entry was not page-aligned after repackaging.
    // Compressed native libraries avoid the Android Package Manager's
    // uncompressed-library alignment requirement; Android extracts them.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
