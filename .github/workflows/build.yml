name: Build ExynosTools Android Layer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslc

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Fetch upstream ExynosTools
        run: git clone --depth 1 --branch 2.1 https://github.com/WearyConcern1165/ExynosTools.git upstream

      - name: Fetch Vulkan dependencies
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git deps/Vulkan-Headers
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Utility-Libraries.git deps/Vulkan-Utility-Libraries
          git clone --depth 1 https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git deps/VulkanMemoryAllocator

      - name: Prepare source
        run: |
          cp -a upstream build-source
          python3 scripts/rename_layer.py build-source
          cp "$GITHUB_WORKSPACE/exports.map" build-source/exports.map
          rm -rf build-source/external/VulkanMemoryAllocator
          mkdir -p build-source/external
          cp -a deps/VulkanMemoryAllocator build-source/external/VulkanMemoryAllocator
          rm -rf build-source/external/Vulkan-Headers
          cp -a deps/Vulkan-Headers build-source/external/Vulkan-Headers
          mkdir -p build-source/external/Vulkan-Utility-Libraries
          cp -a deps/Vulkan-Utility-Libraries/. build-source/external/Vulkan-Utility-Libraries/

      - name: Build ARM64 layer
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          cmake -S build-source -B build-native -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXYNOS_LAYER_BUILD_SHADERS=ON \
            -DEXYNOS_LAYER_EMBED_SHADERS=ON \
            -DEXYNOS_LAYER_USE_SUBMODULE_DEPS=ON \
            -DEXYNOS_LAYER_USE_LOCAL_VULKAN_REPOS=OFF \
            -DEXYNOS_VULKAN_HEADERS_PATH="$GITHUB_WORKSPACE/deps/Vulkan-Headers"
          cmake --build build-native --parallel 2

      - name: Package APK
        shell: bash
        run: |
          rm -rf out
          mkdir -p out/apk-root/lib/arm64-v8a

          cp build-native/libVkLayer_VortekXclipse.so out/apk-root/lib/arm64-v8a/libVkLayer_ExynosTools.so
          cp build-source/VkLayer_vortek_xclipse.json out/apk-root/lib/arm64-v8a/VkLayer_exynostools.json
          python3 scripts/patch_manifest.py out/apk-root/lib/arm64-v8a/VkLayer_exynostools.json

          cat > out/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.wade.exynostools.layer">
            <application
              android:label="ExynosTools Android Layer"
              android:hasCode="false"
              android:extractNativeLibs="false" />
          </manifest>
          EOF

          "$ANDROID_HOME/build-tools/35.0.0/aapt2" link             -o out/base.apk             -I "$ANDROID_HOME/platforms/android-35/android.jar"             --manifest out/AndroidManifest.xml             --min-sdk-version 29             --target-sdk-version 35             --version-code 1             --version-name 1.0             --auto-add-overlay

          # Build a normal APK archive containing the framework-generated resources
          # and the uncompressed native library.
          unzip -q -o out/base.apk -d out/base
          cp -a out/apk-root/. out/base/

          cd out/base
          zip -q -0 -r ../unsigned.apk .
          cd ../..

          # Android requires uncompressed native libraries to be page-aligned.
          "$ANDROID_HOME/build-tools/35.0.0/zipalign"             -P 16 -f 4             out/unsigned.apk             out/aligned.apk

          # Verify the unsigned APK BEFORE signing.
          "$ANDROID_HOME/build-tools/35.0.0/zipalign"             -c -P 16 -v 4             out/aligned.apk

          # Independently calculate the native data offset from ZIP metadata.
          python3 - <<'PY'
          import struct

          apk = "out/aligned.apk"
          target = b"lib/arm64-v8a/libVkLayer_ExynosTools.so"

          with open(apk, "rb") as f:
              data = f.read()

          eocd = data.rfind(b"PK\\x05\\x06")
          if eocd < 0:
              raise SystemExit("No ZIP end-of-central-directory record")

          cd_size = struct.unpack_from("<I", data, eocd + 12)[0]
          cd_off = struct.unpack_from("<I", data, eocd + 16)[0]

          p = cd_off
          found = False
          while p < cd_off + cd_size:
              if data[p:p+4] != b"PK\\x01\\x02":
                  raise SystemExit(f"Bad central directory at {p}")
              name_len, extra_len, comment_len = struct.unpack_from("<HHH", data, p + 28)
              local_off = struct.unpack_from("<I", data, p + 42)[0]
              name = data[p+46:p+46+name_len]

              if name == target:
                  if data[local_off:local_off+4] != b"PK\\x03\\x04":
                      raise SystemExit("Bad local header")
                  local_name_len, local_extra_len = struct.unpack_from("<HH", data, local_off + 26)
                  payload = local_off + 30 + local_name_len + local_extra_len
                  print(f"{target.decode()}: local_header={local_off} payload={payload} payload_mod_4096={payload % 4096} payload_mod_16384={payload % 16384}")
                  if payload % 4096 != 0:
                      raise SystemExit("Native library payload is NOT 4096-byte aligned")
                  found = True
                  break

              p += 46 + name_len + extra_len + comment_len

          if not found:
              raise SystemExit("Native library not found in aligned APK")
          PY

          keytool -genkeypair             -keystore out/debug.keystore             -storepass android             -keypass android             -alias androiddebugkey             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign             --ks out/debug.keystore             --ks-pass pass:android             --key-pass android             --out out/ExynosTools-Layer-debug.apk             out/aligned.apk

          # Signing must not alter the native-library alignment.
          "$ANDROID_HOME/build-tools/35.0.0/zipalign"             -c -P 16 -v 4             out/ExynosTools-Layer-debug.apk

          cp out/ExynosTools-Layer-debug.apk out/final.apk

      - name: Verify final APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose out/final.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 out/final.apk
          unzip -l out/final.apk | grep -E 'AndroidManifest.xml|lib/arm64-v8a/(libVkLayer_ExynosTools.so|VkLayer_exynostools.json)'
          unzip -Z -v out/final.apk | grep -A 18 'libVkLayer_ExynosTools.so'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExynosTools-Layer-debug
          path: out/ExynosTools-Layer-debug.apk
          if-no-files-found: error
