name: Build ExynosTools Android Layer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslc

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Fetch upstream ExynosTools
        run: git clone --depth 1 --branch 2.1 https://github.com/WearyConcern1165/ExynosTools.git upstream

      - name: Fetch Vulkan dependencies
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git deps/Vulkan-Headers
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Utility-Libraries.git deps/Vulkan-Utility-Libraries
          git clone --depth 1 https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git deps/VulkanMemoryAllocator

      - name: Prepare source
        run: |
          cp -a upstream build-source
          python3 scripts/rename_layer.py build-source
          cp "$GITHUB_WORKSPACE/exports.map" build-source/exports.map
          rm -rf build-source/external/VulkanMemoryAllocator
          mkdir -p build-source/external
          cp -a deps/VulkanMemoryAllocator build-source/external/VulkanMemoryAllocator
          rm -rf build-source/external/Vulkan-Headers
          cp -a deps/Vulkan-Headers build-source/external/Vulkan-Headers
          mkdir -p build-source/external/Vulkan-Utility-Libraries
          cp -a deps/Vulkan-Utility-Libraries/. build-source/external/Vulkan-Utility-Libraries/

      - name: Build ARM64 layer
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          cmake -S build-source -B build-native -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXYNOS_LAYER_BUILD_SHADERS=ON \
            -DEXYNOS_LAYER_EMBED_SHADERS=ON \
            -DEXYNOS_LAYER_USE_SUBMODULE_DEPS=ON \
            -DEXYNOS_LAYER_USE_LOCAL_VULKAN_REPOS=OFF \
            -DEXYNOS_VULKAN_HEADERS_PATH="$GITHUB_WORKSPACE/deps/Vulkan-Headers"
          cmake --build build-native --parallel 2

      - name: Package APK with Gradle
        shell: bash
        run: |
          rm -rf app/src/main/jniLibs app/src/main/layer
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/layer/arm64-v8a

          cp build-native/libVkLayer_VortekXclipse.so app/src/main/jniLibs/arm64-v8a/libVkLayer_ExynosTools.so
          cp build-source/VkLayer_vortek_xclipse.json app/src/main/layer/arm64-v8a/VkLayer_exynostools.json
          python3 scripts/patch_manifest.py app/src/main/layer/arm64-v8a/VkLayer_exynostools.json

          chmod +x ./gradlew 2>/dev/null || true
          if [ ! -x ./gradlew ]; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle
            /tmp/gradle/gradle-8.13/bin/gradle --no-daemon assembleDebug
          else
            ./gradlew --no-daemon assembleDebug
          fi

          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/gradle.apk

          # Vulkan layer manifests must live beside the native library in lib/<ABI>.
          unzip -l out/gradle.apk | grep -q 'lib/arm64-v8a/libVkLayer_ExynosTools.so'
          cp out/gradle.apk out/unsigned.apk
          rm -rf /tmp/exynostools-layer-json
          mkdir -p /tmp/exynostools-layer-json/lib/arm64-v8a
          cp app/src/main/layer/arm64-v8a/VkLayer_exynostools.json /tmp/exynostools-layer-json/lib/arm64-v8a/
          cd /tmp/exynostools-layer-json
          zip -q -0 -r "$GITHUB_WORKSPACE/out/unsigned.apk" lib
          cd "$GITHUB_WORKSPACE"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 out/unsigned.apk out/aligned.apk

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 out/aligned.apk

          keytool -genkeypair -keystore out/debug.keystore -storepass android -keypass android \\
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \\
            -dname "CN=Android Debug,O=Android,C=US"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \\
            --ks out/debug.keystore --ks-pass pass:android --key-pass android \\
            --out out/ExynosTools-Layer-debug.apk out/aligned.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose out/ExynosTools-Layer-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 out/ExynosTools-Layer-debug.apk
          unzip -l out/ExynosTools-Layer-debug.apk | grep -E 'lib/arm64-v8a/(libVkLayer_ExynosTools.so|VkLayer_exynostools.json)'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExynosTools-Layer-debug
          path: out/ExynosTools-Layer-debug.apk
          if-no-files-found: error
